{{ partial "header.html" . }}
{{ partial "nav.html" . }}
<article class="container" style="padding: 80px 0; max-width: 700px;">
    <header style="text-align: center; margin-bottom: 60px;">
        <p style="color: var(--text-muted); font-size: 14px;">{{ .Date.Format "2006年1月2日" }}</p>
        <h1 style="font-family: 'EB Garamond', serif; font-size: 42px; line-height: 1.3;">{{ .Title }}</h1>
    </header>
    <div style="font-size: 17px; line-height: 2; color: #333;">
        {{ .Content }}
    </div>
    <div style="margin-top: 60px; border-top: 1px solid #eee; padding-top: 20px;">
        <a href="/posts">← アーカイブへ</a>
    </div>
</article>
{{ partial "footer.html" . }}

{{ partial "header.html" . }}

<div class="section single-article">
    <article class="article-container fade-in-up">
    <header class="article-header">
        <time class="article-date">{{ .Date.Format "2006.01.02" }}</time>
        <h1 class="article-title">{{ .Title }}</h1>
    </header>
    <div class="article-content">
        {{ .Content }}
    </div>
    <div class="article-footer">
        <a href="{{ .Site.BaseURL }}posts/" class="btn-view-more">BACK TO ARTICLES</a>
    </div>
  </article>
</div>

{{ partial "footer.html" . }}

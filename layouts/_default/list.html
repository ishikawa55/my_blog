{{ partial "header.html" . }}
{{ partial "nav.html" . }}
<div class="container" style="padding: 60px 0;">
    <h1 style="font-size: 48px; text-align: center; margin-bottom: 60px;">アーカイブ</h1>
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 60px;">
        {{ range .Paginator.Pages }}
        <article>
            <div class="archive-item" style="margin-bottom: 20px;">
            <a href="{{ .RelPermalink }}">
                <h2 style="font-size: 24px; margin: 20px 0 10px;">{{ .Title }}</h2>
                <p class="summary-desktop" style="color: var(--text-muted); font-size: 14px;">
                    {{ .Summary | plainify | truncate 134 }}
                </p>
                <p class="summary-mobile" style="color: var(--text-muted); font-size: 14px;">
                    {{ .Summary | plainify | truncate 20 }}
                </p>
            </a>
            </div>
        </article>
        {{ end }}
    </div>
</div>
{{ partial "footer.html" . }}

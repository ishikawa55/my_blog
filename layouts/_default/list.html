{{ partial "header.html" . }}

<div class="section">
    <h2 class="section-title fade-in-up">
        記事一覧
    </h2>

    <div class="card-grid">
        {{ range .Pages }}
        <a href="{{ .Permalink }}" class="card fade-in-up">
            <div class="card-img-wrapper">
                {{ if .Params.image }}
                <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" class="card-img">
                {{ else }}
                <div class="card-img" style="background-color: #eee; display: flex; align-items: center; justify-content: center; color: #aaa;">No Image</div>
                {{ end }}
            </div>
            <div class="card-content">
                <time class="card-date">{{ .Date.Format "2006.01.02" }}</time>
                <h3 class="card-title">{{ .Title }}</h3>
            </div>
        </a>
        {{ end }}
    </div>
</div>

{{ partial "footer.html" . }}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">

    <style>
        html {
            scrollbar-gutter: stable;
            scroll-behavior: smooth;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #a855f7;
            --purple-accent: #6a1b9a;
            --archive-title-margin-pc: 80px;
            --archive-title-margin-sp: 40px;
        }

        body {
            background-color: transparent;
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .serif {
            font-family: 'Noto Serif JP', serif;
            font-weight: 700;
            scroll-margin-top: 40px;
        }

        a { color: inherit; text-decoration: none; transition: 0.3s; }
        img { max-width: 100%; height: auto; }

        .container {
            max-width: 1000px;
            margin: 0 auto !important;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        hr { border: none; border-top: 1px solid var(--border-color); margin: 40px 0; }

        /* ボタンデザイン */
        .btn-action {
            display: inline-block !important;
            background-color: var(--purple-accent) !important; 
            color: #ffffff !important;
            padding: 10px 28px !important;
            border-radius: 50px !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            text-decoration: none !important;
            /* transition: background-color 0.3s ease; */
            transition: transform 0.3s ease, background-color 0.3s ease, opacity 0.3s ease !important;
        }

        /* 「拡大」インタラクションの共通設定 */
        .btn-action,
        .read-more,
        .post-summary,
        .archive-item {
            display: inline-block;
            transition: transform 0.3s ease !important;
            cursor: pointer;
        }

        /* ホバー時の挙動 */
        .btn-action:hover,
        .read-more:hover,
        .post-summary:hover,
        .archive-item:hover {
            transform: scale(1.03) !important;
            opacity: 0.9;
        }

        .btn-action:hover {
            background-color: #4a148c !important;
            opacity: 1 !important;
        }

        .hero-gallery {
            width: 100%;
            margin: 60px 0;
            overflow: hidden;
            cursor: grab;
            position: relative;
            user-select: none;
        }

        .hero-gallery:active {
            cursor: grabbing;
        }

        .gallery-scroll-container {
            display: flex;
            gap: 40px;
            padding: 40px 20px;
            will-change: transform;
        }

        .gallery-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .gallery-card {
            flex: 0 0 600px;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border: 2px solid var(--purple-accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            pointer-events: none;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .section-title {
            display: inline-block;
            position: relative;
            padding: .5em 1em;
            border-right: 27px solid #8c25d0;
            background-color: #f5f5f5;
            color: #333333;
            font-family: 'Noto Serif JP', serif;
            font-weight: 700;
            text-shadow: none !important;
            transform: rotate(-1.5deg);
            transform-style: preserve-3d;
            z-index: 1;
        }

        .section-title::before {
            content: "";
            position: absolute;
            bottom: 1px;
            right: -22px;
            width: 100%;
            height: 50%;
            transform: rotate(5deg);
            background-color: rgba(0, 0, 0, 0.8);
            filter: blur(4px);
            transform: translateZ(-1px) rotate(4deg);
            z-index: -1;
        }

        .profile-img-frame {
            border: 3px solid var(--border-color);
            padding: 6px;
            background-color: #ffffff;
            display: inline-block;
            line-height: 0;
        }

        .profile-img-frame img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* インラインコード */
        :not(pre) > code {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f3e5f5;
            color: #6a1b9a;
            padding: 0.02em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            border: 1px solid #e1bee7;
            margin: 0 2px;
            display: inline-block;
        }

        pre {
            background-color: #1e1e1e;
            color: #dcdcdc;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            border-left: 5px solid var(--border-color, #a855f7);
            margin: 25px 0;
            line-height: 1.5;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        pre code {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
            color: inherit;
            font-family: 'Consolas', 'Monaco', 'Andale Mono', monospace;
            font-size: 14px;
        }

        .summary-desktop {
            display: block !important;
        }

        .summary-mobile {
            display: none !important;
        }

        .nav-logo a {
            white-space: nowrap !important;
            font-size: 28px !important;
        }

        .archive-title {
            font-size: 48px;
            text-align: center;
            margin-top: 0;
            margin-bottom: var(--archive-title-margin-pc); 
        }

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
        }

        /* 下線が伸びるボタン */
        .button_line {
            text-align: left;
        }

        .button_line a {
            position: relative;
            display: inline-flex;
            justify-content: space-around;
            align-items: center;
            margin: 0 auto;
            max-width: 200px;
            padding: 10px 25px;
            color: inherit;
            transition: 0.3s ease-in-out;
            font-weight: 600;
            gap: 10px;
        }

        .button_line a:before {
            position: absolute;
            bottom: 0px;
            left: 50%;
            content: '';
            width: 100%;
            height: 2px;
            background: rgba(170, 0, 255, 0.4);
            transform: translateX(-50%);
        }

        .button_line a:after {
            position: absolute;
            bottom: 0px;
            left: 0;
            content: '';
            width: 100%;
            height: 2px;
            background: var(--border-color);
            transform: scale(0, 1);
            transform-origin: left top;
            transition: transform .3s;
        }

        .button_line a:hover {
            opacity: 0.7;
        }

        .button_line a:hover:after {
            transform: scale(1, 1);
        }

        /* 矢印 */
        .arrow {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 2px;
            margin-top: 10px;
            border-radius: 9999px;
            background-color: #ba66ff;
        }

        .arrow::before {
            content: "";
            position: absolute;
            top: calc(50% - 2px);
            left: 0;
            width: 20px;
            height: 2px;
            border-radius: 9999px;
            background-color: #ba66ff;
            transform: rotate(-45deg);
            transform-origin: 2px 50%;
        }

        /* --- レスポンシブ設定 --- */
        @media screen and (min-width: 801px) {
        .nav-logo {
            padding-left: 40px;
        }
        }

        @media screen and (max-width: 800px) {
        .nav-inner {
            flex-direction: column !important;
            gap: 20px !important;
            padding: 40px 20px !important;
        }

        .nav-logo, .nav-menu, .nav-spacer {
            flex: none !important;
            width: 100% !important;
            text-align: center !important;
            justify-content: center !important;
        }

        .nav-logo a {
            padding-top: 20px !important;
        }

        .nav-menu {
            display: flex !important;
            gap: 20px !important;
            font-size: 13px !important;
        }

        .btn-action {
            padding: 5px 15px !important;
            font-size: 12px !important;
        }

        .container {
            padding: 0 15px !important;
        }

        .pc-only-br {
            display: none;
        }

        .summary-desktop {
            display: none !important;
        }
    
        .summary-mobile {
            display: block !important;
            margin-top: 10px;
        }

        .gallery-card {
            flex: 0 0 85vw;
        }

        .archive-title {
            font-size: 32px;
            margin-bottom: var(--archive-title-margin-sp); 
        }

        .archive-grid {
            grid-template-columns: 1fr;
            gap: 40px;
        }
        }

        /* Three.js 背景 */
        #three-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

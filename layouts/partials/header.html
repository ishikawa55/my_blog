<!DOCTYPE html>
<html>
<head>
    <title>{{ .Title }}</title>

    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link href="https://unpkg.com/nes.css/css/nes.min.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet" />
    <link href="/css/nav.css" rel="stylesheet" />
    <link href="/css/misc.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@100..700&display=swap" rel="stylesheet">

    <style>
    /* 全体のレイアウト */
    body {
        background-color: #f0f0f0; /* 全体の背景色 */
        background-image: 
            linear-gradient(#ffffff 1px, transparent 1px), /* 縦線 */
            linear-gradient(90deg, #ffffff 1px, transparent 1px); /* 横線 */
        background-size: 20px 20px; /* 格子のサイズ */
    }

    /* フォントの読み込み */
    @font-face {
        font-family: 'KH-Dot-Hibiya-24';
        src: url('{{ "fonts/KH-Dot-Hibiya-24.ttf" | relURL }}') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    .title, body {
        font-family: "M PLUS 1 Code", monospace;
    }

    h1, h2, h3 {
        font-family: "KH-Dot-Hibiya-24", "Press Start 2P", system-ui !important;
    }

    /* ナビゲーションバー */
    .custom-navigation {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 50px;
        width: 100%;
        background-color: transparent;
    }

    .nav-left, .nav-right {
        flex: 1;
    }

    .nav-center {
        flex: 2;
        text-align: center;
    }

    .nav-center a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        text-decoration: none;
        color: inherit;
    }

    /* ドット絵補正 */
    .beer-icon {
        width: 32px;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    /* 「ishikawaの酒場」看板デザイン */
    .site-title {
        font-family: "KH-Dot-Hibiya-24", "Press Start 2P", sans-serif;
        font-size: 36px;
        font-weight: bold;
        white-space: nowrap;
        letter-spacing: 2px;

        /* ビールをイメージした白と黄金色のグラデーション */
        background: linear-gradient(to bottom, #FFFFFF 40%, #FFCC00 40%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;

        display: inline-block; 

        filter: 
            drop-shadow(2px 2px 0px #000) 
            drop-shadow(-2px -2px 0px #000)
            drop-shadow(2px -2px 0px #000) 
            drop-shadow(-2px 2px 0px #000);
    }

    .nav-right {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
    }

    /* スマホ対応 */
    @media (max-width: 900px) {
        .custom-navigation {
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }
        .nav-center a {
            flex-direction: row;
        }
        .nav-right {
            justify-content: center;
        }
    }

    /* コードブロックのフォント */
    code, pre {
        font-family: "M PLUS 1 Code", monospace !important;
        font-size: 0.9em;
    }

    /* 黒い背景のコードブロック */
    pre {
        background-color: #212529 !important;
        color: #fff !important;
        padding: 1rem !important;
        border: 4px solid #000;
        margin: 1.5rem 0;
        overflow-x: auto;
    }

    /* 記事内のインラインコード */
    :not(pre) > code {
        background-color: #e0e0e0;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        color: #d81b60;
    }

    /* コンテナをヘッダーのデザインと揃える */
    .nes-container {
        border-radius: 0 !important;
        border: 4px solid #000 !important;
        box-shadow: none !important;
        position: relative;

        padding-top: 2.5rem !important; 
        margin-top: 2rem;
    }

    /* NES.cssのコンテナタイトルを枠線の上に綺麗に配置 */
    .nes-container > .title {
        background-color: #f0f0f0 !important;
        padding: 0 10px;
        
        font-family: "KH-Dot-Hibiya-24", "Press Start 2P", system-ui !important;
        font-size: 24px !important; 
        font-weight: bold;

        position: absolute;
        top: 0;
        left: 20px;
        transform: translateY(-50%);

        display: inline-block;
        margin: 0 !important;
    }
    </style>
</head>
<body class="eggplant">
{{ partial "nav.html" . }}
<section class="nes-container with-title main-centered">
